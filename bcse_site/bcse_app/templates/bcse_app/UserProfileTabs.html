{% if userProfile.id %}
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item">
      <label><a class="nav-link active" href="{% url 'bcse:userProfileView' userProfile.id %}">View</a></label>
    </li>
    <li class="nav-item">
      <label><a class="nav-link modal-open" data-bs-toggle="modal" data-bs-target="#profile" data-href="{% url 'bcse:userProfileEdit' userProfile.id %}" href="#">Edit</a></label>
    </li>
    {% if user.is_authenticated and user.userProfile.user_role in 'AS' %}
      <li class="nav-item right">
        <a class="btn modal-open" data-bs-toggle="modal" data-bs-target="#general" data-href="{% url 'bcse:userProfileAuditLogView' userProfile.id %}" href="#">View Audit Log</a>
      </li>
    {% endif %}
  </ul>
{% endif %}
