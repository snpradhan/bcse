<div class="modal-dialog modal-lg">
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="left"> Update Breakout Session </h3>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div id="breakoutSessionMsg" class="msg">
      <ul class="errorlist">
        {% for message in messages %}
        <li {% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message|safe }}</li>
        {% endfor %}
      </ul>
    </div>
    <form class="form" method="post" enctype="multipart/form-data" action="{% url 'bcse:breakoutSessionUpdate' workshop.id form.instance.id %}" id="formBreakoutSessionUpdate">
      {% csrf_token %}
      {{form.media}}
      {{form.management_form}}
      <div class="modal-body">
        <div class="form-group mb-3">
          <label for="id_{{form.timeslot.name}}">
            {{ form.timeslot.label }}
            {% if form.timeslot.field.required %}
            (<span class="required">*</span>)
            {% endif %}
          </label>
          <div>{{form.timeslot}}</div>
          <div class="error">{{ form.timeslot.errors }}</div>
        </div>
        <div class="form-group mb-3">
          <label for="id_{{form.title.name}}">
            {{ form.title.label }}
            {% if form.title.field.required %}
            (<span class="required">*</span>)
            {% endif %}
          </label>
          <div>{{form.title}}</div>
          <div class="error">{{ form.title.errors }}</div>
        </div>
        <div class="form-group mb-3">
          <label for="id_{{form.facilitators.name}}">
            {{ form.facilitators.label }}
            {% if form.facilitators.field.required %}
            (<span class="required">*</span>)
            {% endif %}
          </label>
          <div>{{form.facilitators}}</div>
          <div class="error">{{ form.facilitators.errors }}</div>
        </div>
        </div>
      <div class="modal-footer">
        <div class="form-group buttons">
          <button type="submit" class="btn btn-success">
            Save
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
<script type="text/javascript">
  $(function (){

    $('#formBreakoutSessionUpdate').submit(function(e){
      e.preventDefault();
      var formData = new FormData(this);
      $.ajax({
        type: $(this).attr('method'),
        url: this.action,
        data: formData,
        dataType: 'json',
        context: this,
        cache:false,
        contentType: false,
        processData: false,
        success: function(data, status) {
          console.log(status);
          if(data['success'] == true){
            console.log('success');
            $('#general').modal('toggle');
            location.reload();
          }
          else{
            $('#general').html(data['html']);
          }
        },
        error: function(){
          displayErrorDialog();
        }
      });
    });

  });
</script>
